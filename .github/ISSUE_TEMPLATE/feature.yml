name: Feature request
description: Explain a document workflow that could work better.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would improve the workflow?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround
