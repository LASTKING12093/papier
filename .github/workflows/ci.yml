name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: node scripts/fetch-native.mjs
      - run: node scripts/fetch-qpdf.mjs
      - run: node scripts/prepare-ocr.mjs
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p pdf-core --locked -- --test-threads=1
      - run: cargo build -p pdf-core --locked
      - name: Browser workflow tests
        shell: pwsh
        run: |
          Start-Process node -ArgumentList 'node_modules/vite/bin/vite.js --config apps/desktop/vite.config.ts' -WindowStyle Hidden
          for ($i=0; $i -lt 60; $i++) {
            try { Invoke-WebRequest http://127.0.0.1:1420 -ErrorAction Stop | Out-Null; break } catch { Start-Sleep -Seconds 1 }
          }
          npx playwright test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run package
      - run: node scripts/smoke-bundle.mjs
